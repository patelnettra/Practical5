<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Online Event Registration</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #fce7f3,
                #ede9fe
            );

            padding: 30px;
        }


        .container {

            max-width: 800px;

            margin: auto;

            background: white;

            padding: 30px;

            border-radius: 12px;

            box-shadow:
                0 5px 20px
                rgba(0,0,0,0.15);
        }


        h1 {

            text-align: center;

            color: #7e22ce;

            margin-bottom: 10px;
        }


        .subtitle {

            text-align: center;

            color: #555;

            margin-bottom: 25px;
        }


        fieldset {

            border: 1px solid #d8b4fe;

            border-radius: 8px;

            padding: 20px;

            margin-bottom: 20px;
        }


        legend {

            font-weight: bold;

            color: #7e22ce;

            padding: 0 10px;
        }


        .form-group {

            margin-bottom: 18px;
        }


        label {

            display: block;

            font-weight: bold;

            margin-bottom: 7px;
        }


        input,
        select {

            width: 100%;

            padding: 11px;

            border: 1px solid #94a3b8;

            border-radius: 6px;

            font-size: 15px;
        }


        input:focus,
        select:focus {

            outline: none;

            border-color: #9333ea;
        }


        .row {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 20px;
        }


        .payment-method {

            display: flex;

            gap: 20px;

            margin-bottom: 15px;
        }


        .payment-method label {

            font-weight: normal;
        }


        .payment-method input {

            width: auto;
        }


        .error {

            color: red;

            font-size: 13px;

            margin-top: 5px;

            display: block;
        }


        button {

            width: 100%;

            padding: 14px;

            background: #9333ea;

            color: white;

            border: none;

            border-radius: 7px;

            font-size: 17px;

            cursor: pointer;
        }


        button:hover {

            background: #7e22ce;
        }


        #confirmation {

            display: none;

            margin-top: 20px;

            padding: 20px;

            background: #dcfce7;

            color: #166534;

            border-radius: 8px;

            text-align: center;
        }


        #confirmation h2 {

            margin-bottom: 10px;
        }


        @media(max-width:600px) {

            body {
                padding: 10px;
            }


            .container {
                padding: 20px;
            }


            .row {
                grid-template-columns: 1fr;
                gap: 0;
            }


            .payment-method {
                flex-direction: column;
                gap: 5px;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <h1>
        Online Event Registration
    </h1>


    <p class="subtitle">
        Register for the upcoming college event
    </p>


    <form id="eventForm" novalidate>


        <!-- PARTICIPANT DETAILS -->

        <fieldset>

            <legend>
                Participant Details
            </legend>


            <div class="row">


                <div class="form-group">

                    <label for="firstName">
                        First Name *
                    </label>

                    <input
                        type="text"
                        id="firstName"
                        placeholder="Enter first name"
                    >

                    <span
                        id="firstNameError"
                        class="error">
                    </span>

                </div>


                <div class="form-group">

                    <label for="lastName">
                        Last Name *
                    </label>

                    <input
                        type="text"
                        id="lastName"
                        placeholder="Enter last name"
                    >

                    <span
                        id="lastNameError"
                        class="error">
                    </span>

                </div>

            </div>


            <div class="form-group">

                <label for="email">
                    Email Address *
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="example@gmail.com"
                >

                <span
                    id="emailError"
                    class="error">
                </span>

            </div>


            <div class="form-group">

                <label for="mobile">
                    Mobile Number *
                </label>

                <input
                    type="tel"
                    id="mobile"
                    maxlength="10"
                    placeholder="10 digit mobile number"
                >

                <span
                    id="mobileError"
                    class="error">
                </span>

            </div>


            <div class="form-group">

                <label for="event">
                    Select Event *
                </label>

                <select id="event">

                    <option value="">
                        -- Select Event --
                    </option>

                    <option value="Web Development Workshop">
                        Web Development Workshop
                    </option>

                    <option value="Coding Competition">
                        Coding Competition
                    </option>

                    <option value="Tech Seminar">
                        Tech Seminar
                    </option>

                    <option value="Hackathon">
                        Hackathon
                    </option>

                </select>

                <span
                    id="eventError"
                    class="error">
                </span>

            </div>

        </fieldset>



        <!-- PAYMENT -->

        <fieldset>

            <legend>
                Payment Information
            </legend>


            <div class="form-group">

                <label>
                    Payment Method *
                </label>


                <div class="payment-method">

                    <label>

                        <input
                            type="radio"
                            name="payment"
                            value="Card"
                            onchange="showPaymentFields()"
                        >

                        Card

                    </label>


                    <label>

                        <input
                            type="radio"
                            name="payment"
                            value="UPI"
                            onchange="showPaymentFields()"
                        >

                        UPI

                    </label>


                    <label>

                        <input
                            type="radio"
                            name="payment"
                            value="Cash"
                            onchange="showPaymentFields()"
                        >

                        Cash

                    </label>

                </div>


                <span
                    id="paymentError"
                    class="error">
                </span>

            </div>



            <!-- CARD DETAILS -->

            <div
                id="cardFields"
                style="display:none;">

                <div class="form-group">

                    <label for="cardNumber">
                        Card Number
                    </label>

                    <input
                        type="text"
                        id="cardNumber"
                        maxlength="16"
                        placeholder="16 digit card number"
                    >

                    <span
                        id="cardNumberError"
                        class="error">
                    </span>

                </div>


                <div class="row">

                    <div class="form-group">

                        <label for="expiry">
                            Expiry Date
                        </label>

                        <input
                            type="month"
                            id="expiry"
                        >

                        <span
                            id="expiryError"
                            class="error">
                        </span>

                    </div>


                    <div class="form-group">

                        <label for="cvv">
                            CVV
                        </label>

                        <input
                            type="password"
                            id="cvv"
                            maxlength="3"
                            placeholder="3 digit CVV"
                        >

                        <span
                            id="cvvError"
                            class="error">
                        </span>

                    </div>

                </div>

            </div>



            <!-- UPI -->

            <div
                id="upiFields"
                style="display:none;">

                <div class="form-group">

                    <label for="upi">
                        UPI ID
                    </label>

                    <input
                        type="text"
                        id="upi"
                        placeholder="example@upi"
                    >

                    <span
                        id="upiError"
                        class="error">
                    </span>

                </div>

            </div>


        </fieldset>



        <!-- CONFIRMATION -->

        <fieldset>

            <legend>
                Confirmation
            </legend>


            <div class="form-group">

                <label>

                    <input
                        type="checkbox"
                        id="terms"
                    >

                    I confirm that the above information
                    is correct.

                </label>


                <span
                    id="termsError"
                    class="error">
                </span>

            </div>

        </fieldset>


        <button type="submit">
            Register for Event
        </button>


        <div id="confirmation">

            <h2>
                Registration Successful!
            </h2>

            <p>
                Thank you for registering for the event.
            </p>

            <p>
                A confirmation message will be sent
                to your registered email address.
            </p>

        </div>


    </form>

</div>



<script>


    // Show payment fields according to method

    function showPaymentFields() {

        let payment =
            document.querySelector(
                'input[name="payment"]:checked'
            );


        let cardFields =
            document.getElementById("cardFields");


        let upiFields =
            document.getElementById("upiFields");


        cardFields.style.display = "none";

        upiFields.style.display = "none";


        if (!payment) {
            return;
        }


        if (payment.value === "Card") {

            cardFields.style.display = "block";

        }


        if (payment.value === "UPI") {

            upiFields.style.display = "block";

        }

    }



    // Form validation

    document
        .getElementById("eventForm")
        .addEventListener(
            "submit",
            function(event) {

                event.preventDefault();


                let valid = true;


                // Clear errors

                document
                    .querySelectorAll(".error")
                    .forEach(function(error) {

                        error.innerText = "";

                    });



                // First Name

                let firstName =
                    document
                    .getElementById("firstName")
                    .value.trim();


                if (firstName === "") {

                    document
                        .getElementById(
                            "firstNameError"
                        )
                        .innerText =
                        "First name is required.";

                    valid = false;

                }



                // Last Name

                let lastName =
                    document
                    .getElementById("lastName")
                    .value.trim();


                if (lastName === "") {

                    document
                        .getElementById(
                            "lastNameError"
                        )
                        .innerText =
                        "Last name is required.";

                    valid = false;

                }



                // Email

                let email =
                    document
                    .getElementById("email")
                    .value.trim();


                let emailPattern =
                    /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


                if (!emailPattern.test(email)) {

                    document
                        .getElementById(
                            "emailError"
                        )
                        .innerText =
                        "Enter a valid email.";

                    valid = false;

                }



                // Mobile

                let mobile =
                    document
                    .getElementById("mobile")
                    .value.trim();


                let mobilePattern =
                    /^[0-9]{10}$/;


                if (!mobilePattern.test(mobile)) {

                    document
                        .getElementById(
                            "mobileError"
                        )
                        .innerText =
                        "Enter a valid 10 digit mobile number.";

                    valid = false;

                }



                // Event

                let eventName =
                    document
                    .getElementById("event")
                    .value;


                if (eventName === "") {

                    document
                        .getElementById(
                            "eventError"
                        )
                        .innerText =
                        "Please select an event.";

                    valid = false;

                }



                // Payment method

                let payment =
                    document.querySelector(
                        'input[name="payment"]:checked'
                    );


                if (!payment) {

                    document
                        .getElementById(
                            "paymentError"
                        )
                        .innerText =
                        "Please select a payment method.";

                    valid = false;

                }



                // CARD VALIDATION

                if (
                    payment &&
                    payment.value === "Card"
                ) {


                    let cardNumber =
                        document
                        .getElementById("cardNumber")
                        .value.trim();


                    if (!/^[0-9]{16}$/.test(cardNumber)) {

                        document
                            .getElementById(
                                "cardNumberError"
                            )
                            .innerText =
                            "Card number must contain 16 digits.";

                        valid = false;

                    }


                    let expiry =
                        document
                        .getElementById("expiry")
                        .value;


                    if (expiry === "") {

                        document
                            .getElementById(
                                "expiryError"
                            )
                            .innerText =
                            "Expiry date is required.";

                        valid = false;

                    }


                    let cvv =
                        document
                        .getElementById("cvv")
                        .value.trim();


                    if (!/^[0-9]{3}$/.test(cvv)) {

                        document
                            .getElementById(
                                "cvvError"
                            )
                            .innerText =
                            "CVV must contain 3 digits.";

                        valid = false;

                    }

                }



                // UPI VALIDATION

                if (
                    payment &&
                    payment.value === "UPI"
                ) {


                    let upi =
                        document
                        .getElementById("upi")
                        .value.trim();


                    let upiPattern =
                        /^[a-zA-Z0-9._-]+@[a-zA-Z]+$/;


                    if (!upiPattern.test(upi)) {

                        document
                            .getElementById(
                                "upiError"
                            )
                            .innerText =
                            "Enter a valid UPI ID.";

                        valid = false;

                    }

                }



                // Terms

                let terms =
                    document
                    .getElementById("terms")
                    .checked;


                if (!terms) {

                    document
                        .getElementById(
                            "termsError"
                        )
                        .innerText =
                        "Please confirm the information.";

                    valid = false;

                }



                // Final result

                if (valid) {

                    document
                        .getElementById(
                            "confirmation"
                        )
                        .style.display = "block";


                    document
                        .getElementById(
                            "eventForm"
                        )
                        .reset();


                    document
                        .getElementById(
                            "cardFields"
                        )
                        .style.display = "none";


                    document
                        .getElementById(
                            "upiFields"
                        )
                        .style.display = "none";

                }

            }
        );

</script>


</body>

</html>
