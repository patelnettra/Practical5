<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Online Student Admission Form</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #e0e7ff);
            padding: 30px;
        }

        .container {
            max-width: 850px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #1e3a8a;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #555;
            margin-bottom: 25px;
        }

        fieldset {
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        legend {
            font-weight: bold;
            color: #1e3a8a;
            padding: 0 10px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #94a3b8;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #2563eb;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .gender-group {
            display: flex;
            gap: 20px;
        }

        .gender-group label {
            font-weight: normal;
        }

        .gender-group input {
            width: auto;
        }

        .error {
            color: red;
            font-size: 13px;
            margin-top: 5px;
            display: block;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #successMessage {
            display: none;
            background: #dcfce7;
            color: #166534;
            padding: 15px;
            border-radius: 7px;
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
        }

        @media (max-width: 600px) {

            body {
                padding: 10px;
            }

            .container {
                padding: 20px;
            }

            .row {
                grid-template-columns: 1fr;
                gap: 0;
            }

        }

    </style>

</head>


<body>


<div class="container">

    <h1>Online Student Admission Form</h1>

    <p class="subtitle">
        Please enter your academic and personal information
    </p>


    <form id="admissionForm" novalidate>


        <!-- PERSONAL INFORMATION -->

        <fieldset>

            <legend>Personal Information</legend>


            <div class="row">

                <div class="form-group">

                    <label for="firstName">
                        First Name *
                    </label>

                    <input
                        type="text"
                        id="firstName"
                        placeholder="Enter first name"
                    >

                    <span
                        id="firstNameError"
                        class="error">
                    </span>

                </div>


                <div class="form-group">

                    <label for="lastName">
                        Last Name *
                    </label>

                    <input
                        type="text"
                        id="lastName"
                        placeholder="Enter last name"
                    >

                    <span
                        id="lastNameError"
                        class="error">
                    </span>

                </div>

            </div>


            <div class="row">

                <div class="form-group">

                    <label for="dob">
                        Date of Birth *
                    </label>

                    <input
                        type="date"
                        id="dob"
                    >

                    <span
                        id="dobError"
                        class="error">
                    </span>

                </div>


                <div class="form-group">

                    <label>Gender *</label>

                    <div class="gender-group">

                        <label>
                            <input
                                type="radio"
                                name="gender"
                                value="Male"
                            >
                            Male
                        </label>

                        <label>
                            <input
                                type="radio"
                                name="gender"
                                value="Female"
                            >
                            Female
                        </label>

                        <label>
                            <input
                                type="radio"
                                name="gender"
                                value="Other"
                            >
                            Other
                        </label>

                    </div>

                    <span
                        id="genderError"
                        class="error">
                    </span>

                </div>

            </div>


            <div class="form-group">

                <label for="email">
                    Email Address *
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="example@gmail.com"
                >

                <span
                    id="emailError"
                    class="error">
                </span>

            </div>


            <div class="form-group">

                <label for="mobile">
                    Mobile Number *
                </label>

                <input
                    type="tel"
                    id="mobile"
                    placeholder="10 digit mobile number"
                    maxlength="10"
                >

                <span
                    id="mobileError"
                    class="error">
                </span>

            </div>


            <div class="form-group">

                <label for="address">
                    Address *
                </label>

                <textarea
                    id="address"
                    rows="3"
                    placeholder="Enter your address">
                </textarea>

                <span
                    id="addressError"
                    class="error">
                </span>

            </div>

        </fieldset>



        <!-- ACADEMIC INFORMATION -->

        <fieldset>

            <legend>Academic Information</legend>


            <div class="form-group">

                <label for="course">
                    Select Course *
                </label>

                <select id="course">

                    <option value="">
                        -- Select Course --
                    </option>

                    <option value="BCA">
                        BCA
                    </option>

                    <option value="BBA">
                        BBA
                    </option>

                    <option value="B.Tech">
                        B.Tech
                    </option>

                    <option value="B.Sc">
                        B.Sc
                    </option>

                    <option value="B.Com">
                        B.Com
                    </option>

                </select>

                <span
                    id="courseError"
                    class="error">
                </span>

            </div>


            <div class="row">

                <div class="form-group">

                    <label for="school">
                        Previous School/College *
                    </label>

                    <input
                        type="text"
                        id="school"
                        placeholder="Enter institution name"
                    >

                    <span
                        id="schoolError"
                        class="error">
                    </span>

                </div>


                <div class="form-group">

                    <label for="percentage">
                        Previous Percentage *
                    </label>

                    <input
                        type="number"
                        id="percentage"
                        placeholder="Enter percentage"
                        min="0"
                        max="100"
                        step="0.01"
                    >

                    <span
                        id="percentageError"
                        class="error">
                    </span>

                </div>

            </div>

        </fieldset>



        <!-- DECLARATION -->

        <fieldset>

            <legend>Declaration</legend>

            <div class="form-group">

                <label>

                    <input
                        type="checkbox"
                        id="declaration"
                    >

                    I declare that the information provided
                    above is correct.

                </label>

                <span
                    id="declarationError"
                    class="error">
                </span>

            </div>

        </fieldset>


        <button type="submit">
            Submit Admission Form
        </button>


        <div id="successMessage">
            Admission form submitted successfully!
        </div>

    </form>

</div>



<script>

    document
        .getElementById("admissionForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();

            let valid = true;


            // Clear previous errors
            document.querySelectorAll(".error")
                .forEach(function(error) {
                    error.innerText = "";
                });


            // First Name
            let firstName =
                document.getElementById("firstName").value.trim();

            if (firstName === "") {

                document.getElementById("firstNameError")
                    .innerText =
                    "First name is required.";

                valid = false;

            }


            // Last Name
            let lastName =
                document.getElementById("lastName").value.trim();

            if (lastName === "") {

                document.getElementById("lastNameError")
                    .innerText =
                    "Last name is required.";

                valid = false;

            }


            // Date of Birth
            let dob =
                document.getElementById("dob").value;

            if (dob === "") {

                document.getElementById("dobError")
                    .innerText =
                    "Date of birth is required.";

                valid = false;

            }


            // Gender
            let gender =
                document.querySelector(
                    'input[name="gender"]:checked'
                );

            if (!gender) {

                document.getElementById("genderError")
                    .innerText =
                    "Please select gender.";

                valid = false;

            }


            // Email
            let email =
                document.getElementById("email").value.trim();

            let emailPattern =
                /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (email === "") {

                document.getElementById("emailError")
                    .innerText =
                    "Email is required.";

                valid = false;

            }
            else if (!emailPattern.test(email)) {

                document.getElementById("emailError")
                    .innerText =
                    "Enter a valid email address.";

                valid = false;

            }


            // Mobile
            let mobile =
                document.getElementById("mobile").value.trim();

            let mobilePattern =
                /^[0-9]{10}$/;

            if (!mobilePattern.test(mobile)) {

                document.getElementById("mobileError")
                    .innerText =
                    "Enter a valid 10 digit mobile number.";

                valid = false;

            }


            // Address
            let address =
                document.getElementById("address").value.trim();

            if (address === "") {

                document.getElementById("addressError")
                    .innerText =
                    "Address is required.";

                valid = false;

            }


            // Course
            let course =
                document.getElementById("course").value;

            if (course === "") {

                document.getElementById("courseError")
                    .innerText =
                    "Please select a course.";

                valid = false;

            }


            // School
            let school =
                document.getElementById("school").value.trim();

            if (school === "") {

                document.getElementById("schoolError")
                    .innerText =
                    "Previous institution is required.";

                valid = false;

            }


            // Percentage
            let percentage =
                document.getElementById("percentage").value;

            if (
                percentage === "" ||
                percentage < 0 ||
                percentage > 100
            ) {

                document.getElementById("percentageError")
                    .innerText =
                    "Percentage must be between 0 and 100.";

                valid = false;

            }


            // Declaration
            let declaration =
                document.getElementById("declaration").checked;

            if (!declaration) {

                document.getElementById("declarationError")
                    .innerText =
                    "Please accept the declaration.";

                valid = false;

            }


            // Final result
            if (valid) {

                document.getElementById("successMessage")
                    .style.display = "block";

                document.getElementById("admissionForm")
                    .reset();

            }

        });

</script>


</body>

</html>
